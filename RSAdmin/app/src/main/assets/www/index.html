<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>RS Admin</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="grain"></div></div>
  <div id="app"></div>
  <div id="layer"></div>
  <div id="toasts" role="status"></div>

  <div id="splash">

      <p class="splash-status" id="splash-status">Conectando…</p>
    </div>
    <footer class="splash-foot"><strong>FlowLabs Studio</strong><span>Acesso restrito a administradores</span></footer>
  </div>

  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/native.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/apk.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/admin.js"></script>

</html>
