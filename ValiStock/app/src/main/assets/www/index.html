<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07080d">
  <title>ValiStock</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Fundo: manchas de cor desfocadas que dão vida ao vidro fosco -->
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <div class="grain"></div>
  </div>

  <div id="app" aria-live="polite"></div>
  <div id="layer"></div>
  <div id="toasts" role="status"></div>

  <!-- Tela de abertura -->
  <div id="splash" role="progressbar" aria-label="Carregando ValiStock">
    <div class="splash-center">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--accent)"/>
              <stop offset="1" stop-color="var(--accent-2)"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#lg)" opacity=".22"/>
          <rect x="4.5" y="4.5" width="55" height="55" rx="17.5" fill="none" stroke="url(#lg)" stroke-opacity=".7"/>
          <path d="M20 31.5l8 8.5 16-18" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="splash-title">ValiStock</h1>
      <p class="splash-sub">Validades sob controle</p>
      <div class="loader-line"><i id="splash-bar"></i></div>
      <p class="splash-status" id="splash-status">Iniciando…</p>
    </div>
    <footer class="splash-foot">
      <strong>Flow Labs Studio</strong>
      <span>© <span id="splash-year">2026</span> · Todos os direitos reservados</span>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services/native.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/services/scanner.js"></script>
  <script src="js/services/exporter.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/products.js"></script>
  <script src="js/screens/editor.js"></script>
  <script src="js/screens/export.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
